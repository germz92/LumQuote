<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads - LumQuote</title>
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="phase2.css">
    <link rel="stylesheet" href="phase5.css">
    <link rel="stylesheet" href="crm.css">
    <link rel="stylesheet" href="page-controls.css">
    <link rel="icon" href="/assets/lumquote_transparent_favicon.png" type="image/png">
</head>
<body data-app-page="leads" data-app-title="Leads" data-app-subtitle="Website inquiries, assignment, and quotes">
    <div class="container">
        <main class="main-content">
            <div class="quotes-page-section">
                <div class="page-controls-sticky">
                    <div class="page-controls" id="leadsPageControls">
                        <div class="pc-toolbar">
                            <div class="pc-search">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input type="text" id="searchLeads" placeholder="Search leads..." oninput="leadsManager.debouncedSearch()">
                            </div>
                            <button type="button" class="pc-btn pc-filters-toggle" aria-expanded="false" aria-controls="leadsFiltersDrawer" onclick="PageControls.toggleFilters(this)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                                </svg>
                                <span class="pc-filters-toggle-label">Filters</span>
                            </button>
                            <div class="pc-actions">
                                <button type="button" class="pc-btn" id="assignModeBtn" hidden aria-pressed="false" onclick="leadsManager.toggleAssignMode()">Assign mode</button>
                            </div>
                            <button type="button" class="btn btn-primary btn-md pc-primary-cta" onclick="leadsManager.openCreateModal()" title="New Lead">
                                <span class="pc-cta-full">+ New Lead</span>
                                <span class="pc-cta-short" aria-hidden="true">+</span>
                            </button>
                        </div>
                        <div class="pc-filters-drawer" id="leadsFiltersDrawer">
                            <select id="statusFilter" class="pc-select" onchange="leadsManager.applyFilters()">
                                <option value="">All Statuses</option>
                                <option value="pending" selected>Pending</option>
                                <option value="unassigned">Unassigned</option>
                                <option value="lead">Lead</option>
                                <option value="assigned">Assigned</option>
                                <option value="quoted">Quoted</option>
                                <option value="converted">Converted</option>
                                <option value="stale">Stale</option>
                                <option value="not_converted">Not Converted</option>
                                <option value="archived">Archived</option>
                            </select>
                            <button type="button" class="pc-clear" id="clearFiltersBtn" onclick="leadsManager.clearFilters()" style="display: none;">Clear</button>
                        </div>
                    </div>
                </div>

                <div class="leads-workspace">
                <div class="leads-table-pane">
                    <div class="lead-assignee-view" id="assigneeViewBar" hidden>
                        <span id="assigneeViewLabel"></span>
                        <button type="button" class="pc-clear" onclick="leadsManager.clearAssignee()">All leads</button>
                    </div>
                <div class="quotes-list-scroll">
                    <div class="quotes-list-view">
                        <table class="quotes-table leads-table">
                            <thead>
                                <tr>
                                    <th class="sortable" onclick="leadsManager.sortByColumn('name')">Name <span class="sort-indicator" data-sort="name"></span></th>
                                    <th class="sortable col-fold-sm" onclick="leadsManager.sortByColumn('email')">Email <span class="sort-indicator" data-sort="email"></span></th>
                                    <th class="sortable col-hide-sm col-fold-sm" onclick="leadsManager.sortByColumn('phone')">Phone <span class="sort-indicator" data-sort="phone"></span></th>
                                    <th class="col-fold-sm">Services</th>
                                    <th class="sortable" onclick="leadsManager.sortByColumn('created')">Submitted <span class="sort-indicator" data-sort="created"></span></th>
                                    <th class="sortable" onclick="leadsManager.sortByColumn('status')">Status <span class="sort-indicator" data-sort="status"></span></th>
                                    <th class="col-fold-sm">Assigned to</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="leadsTableBody"></tbody>
                        </table>
                        <div id="leadsEmpty" class="crm-empty" style="display: none;">
                            <h3>No leads yet</h3>
                            <p>Inquiries from the website form will show up here.</p>
                        </div>
                    </div>
                </div>
                </div>
                <aside class="lead-assign-board" aria-label="Assign leads">
                    <div class="lead-assign-board-head">
                        <h3>Assign</h3>
                        <select id="assigneeCountFilter" class="pc-select" onchange="leadsManager.loadAssigneeCounts().then(() => leadsManager.renderAssignees())">
                            <option value="all">All</option>
                            <option value="pending" selected>Pending</option>
                            <option value="lead">Lead</option>
                            <option value="assigned">Assigned</option>
                            <option value="quoted">Quoted</option>
                            <option value="converted">Converted</option>
                            <option value="stale">Stale</option>
                            <option value="not_converted">Not Converted</option>
                            <option value="archived">Archived</option>
                        </select>
                    </div>
                    <p class="lead-assign-hint" id="leadAssignHint">Turn on Assign mode to select leads and drag them onto a name.</p>
                    <div class="lead-assign-columns">
                        <span class="lead-assign-name-head">
                            Name
                            <button type="button" class="lead-name-filter-btn" id="assignNameFilterBtn" aria-label="Filter names" aria-expanded="false" onclick="leadsManager.toggleNameFilter(event)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                                </svg>
                            </button>
                        </span>
                        <span>Leads</span>
                        <div id="assignNameFilter" class="lead-name-filter" hidden>
                            <input type="search" id="assignNameFilterSearch" placeholder="Search" oninput="leadsManager.renderNameFilterList()">
                            <label class="lead-name-filter-row">
                                <input type="checkbox" id="assignNameFilterAll" onchange="leadsManager.toggleAllNameFilter(this.checked)">
                                <span>(Select All)</span>
                            </label>
                            <div id="assignNameFilterList"></div>
                        </div>
                    </div>
                    <div id="leadAssignBoard"></div>
                </aside>
                </div>
            </div>
        </main>
    </div>

    <div id="createLeadModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Lead</h2>
                <span class="close" onclick="leadsManager.closeCreateModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="createLeadForm" onsubmit="leadsManager.createLead(event)">
                    <div class="create-lead-columns">
                        <div>
                            <div class="form-group">
                                <label for="newLeadName">Name *</label>
                                <input type="text" id="newLeadName" required maxlength="120" placeholder="Full name">
                            </div>
                            <div class="form-group">
                                <label for="newLeadEmail">Email *</label>
                                <input type="email" id="newLeadEmail" required maxlength="200" placeholder="name@email.com">
                            </div>
                            <div class="form-group">
                                <label for="newLeadPhone">Phone *</label>
                                <input type="tel" id="newLeadPhone" required maxlength="40" placeholder="Phone number">
                            </div>
                            <div class="form-group">
                                <label for="leadSource">How did you hear about us? *</label>
                                <select id="leadSource" required onchange="handleLeadSourceChange()">
                                    <option value="">Select lead source</option>
                                </select>
                            </div>
                            <div class="form-group" id="leadSourceReferralGroup" style="display: none;">
                                <label for="leadSourceReferral">Referred by *</label>
                                <input type="text" id="leadSourceReferral" maxlength="120">
                            </div>
                            <div class="form-group" id="leadSourceOtherGroup" style="display: none;">
                                <label for="leadSourceOther">Specify lead source *</label>
                                <input type="text" id="leadSourceOther" maxlength="120">
                            </div>
                            <div class="form-group" id="leadSourceEventGroup" style="display: none;">
                                <label for="leadSourceEvent">Event name *</label>
                                <input type="text" id="leadSourceEvent" maxlength="120">
                            </div>
                        </div>
                        <div>
                            <div class="form-group">
                                <label for="newLeadMessage">Message *</label>
                                <textarea id="newLeadMessage" required maxlength="4000" rows="5" placeholder="What they need"></textarea>
                            </div>
                            <fieldset class="form-group lead-service-fieldset">
                                <legend>Services *</legend>
                                <div id="newLeadServices" class="lead-service-list"></div>
                            </fieldset>
                        </div>
                    </div>
                    <div class="modal-buttons">
                        <button type="button" class="secondary-button" onclick="leadsManager.closeCreateModal()">Cancel</button>
                        <button type="submit" class="primary-button">Create lead</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="toasts.js"></script>
    <script src="a11y.js"></script>
    <script src="modals.js"></script>
    <script src="shell.js"></script>
    <script src="page-controls.js"></script>
    <script src="crm-common.js"></script>
    <script src="lead-sources.js"></script>
    <script src="leads.js"></script>
</body>
</html>
